name: Sincronizar datos de Meta y TikTok desde Drive

# Descarga los Excel de Meta Ads y TikTok Ads y los reportes PDF de Drive, regenera
# data/rk-ads-2026.json y lo publica en main (GitHub Pages lo sirve al cliente). Lo dispara el
# boton "Sincronizar con Drive" del tablero via scripts/sync-trigger.gs; tambien se puede correr a
# mano desde Actions y corre solo todos los dias.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # 7:00 a. m. hora de Lima

permissions:
  contents: write

concurrency:
  group: sync-ads-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias
        run: pip install --disable-pip-version-check -q pandas openpyxl pypdf google-api-python-client google-auth

      - name: Descargar carpetas de Drive
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
        run: python scripts/drive-download.py --out "$RUNNER_TEMP/rekluta"

      - name: Regenerar data/rk-ads-2026.json
        run: python scripts/build-ads-data.py --root "$RUNNER_TEMP/rekluta"

      - name: Publicar en main
        run: |
          git config user.name "rekluta-sync[bot]"
          git config user.email "rekluta-sync@users.noreply.github.com"
          # syncedAt cambia en cada corrida y es lo que el tablero espera para saber que termino,
          # asi que se publica siempre, aunque los demas datos no hayan cambiado.
          git add data/rk-ads-2026.json
          git commit -m "data: sincronizacion desde Drive ($(date -u +%Y-%m-%dT%H:%MZ))" || exit 0
          git push
